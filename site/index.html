  <script src="runtime-config.js"></script>
  <script>
    // The first reads leave now, while the modules download; app.js and platform.js each take theirs once.
    (() => {
      const api = new URL(globalThis.SAME_PROMPT_CONFIG?.apiBaseUrl || 'api/', document.baseURI);
      if (api.pathname === '/') api.pathname = '/api/';
      if (!api.pathname.endsWith('/')) api.pathname += '/';
      const read = (url, options) => {
        const request = fetch(url, options);
        request.catch(() => {});
        return request;
      };
      globalThis.GALLERY_BOOT = {
        data: read('data.json', { cache: 'no-cache' }),
        catalog: read(new URL('catalog', api), { credentials: 'omit', cache: 'no-cache', signal: AbortSignal.timeout(15000) }),
        session: read(new URL('session', api), { credentials: 'include', cache: 'no-store', signal: AbortSignal.timeout(15000) }),
      };
    })();
  </script>
  <script type="module" src="app.js"></script>
